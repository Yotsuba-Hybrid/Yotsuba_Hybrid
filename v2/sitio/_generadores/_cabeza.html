<script>
  (function () {
    var langs = ['es', 'en'], saved = null;
    try { saved = localStorage.getItem('yotsuba-language'); } catch (_) {}
    var prefs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    var det = prefs.map(function (l) { return String(l || '').toLowerCase().split(/[-_]/)[0]; })
                   .filter(function (l) { return langs.indexOf(l) > -1; })[0];
    var lang = langs.indexOf(saved) > -1 ? saved : (det || 'es');
    document.documentElement.lang = lang;
    window.__LANG__ = lang;
  }());
</script>
